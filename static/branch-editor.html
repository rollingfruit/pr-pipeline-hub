<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新建分支联合验证</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#203040;font:14px system-ui;letter-spacing:0}header{display:flex;gap:24px;align-items:center;background:white;border-bottom:1px solid #dbe2eb;padding:20px 28px}a{color:#087f91}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:24px}h2{font-size:17px;margin:28px 0 16px}input,select,button{font:inherit;padding:10px;border:1px solid #bac8d8;border-radius:4px;background:white;min-width:0}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#087f91;color:white;border:0}#name{width:min(100%,480px)}.row{display:grid;grid-template-columns:2fr 2fr 2fr 42px;gap:12px;padding:14px 0;border-bottom:1px solid #dbe2eb}.row label{display:grid;gap:8px}.row button{align-self:end}section{padding-bottom:20px;border-bottom:1px solid #dbe2eb}.choices{display:flex;flex-wrap:wrap;gap:18px}.choices label{display:flex;align-items:center;gap:6px}#versions{overflow-x:auto}table{border-collapse:collapse;width:100%;margin:18px 0}th,td{text-align:left;padding:12px;border-bottom:1px solid #dbe2eb;overflow-wrap:anywhere}code{font-size:12px}#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#9b361c;min-height:24px}.actions{display:flex;gap:14px;align-items:center;margin-top:24px}.muted{color:#69798c}button:focus-visible,a:focus-visible{outline:2px solid #087f91;outline-offset:3px}@media(max-width:650px){main{padding:16px}.row{grid-template-columns:1fr 42px}.row label{grid-column:1}.row button{grid-column:2;grid-row:1}header{padding:16px;flex-wrap:wrap}th,td{padding:8px}}
</style><header><strong>Pipeline Hub</strong><a href="__PIPELINE_BASE__/">执行记录</a><a href="/">构建平台</a></header>
<style>.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 42px}details{margin-top:16px}summary{cursor:pointer}#versions table{table-layout:fixed}@media(max-width:650px){.row{grid-template-columns:minmax(0,1fr) 42px}.actions{flex-wrap:wrap}}</style>
<main><h1>新建分支联合验证</h1><p class="muted">执行环境：CI 隔离环境 · dev-gamma E2E 接入准备中</p><label>批次名称 <input id="name" maxlength="120" value="跨仓关键链路回归"></label>
<section><h2>仓库与分支</h2><div id="rows"></div><button id="add" type="button">＋ 添加仓库</button><p class="muted">public-service、observability：尚无候选构建映射</p></section>
<section><h2>E2E 用例</h2><div id="suites" class="choices"></div><p id="scope" class="muted"></p><details><summary>高级设置</summary><p class="muted">只验证所选分支，不自动合并 main。对照测试使用各仓库默认分支。</p><label><input type="checkbox" id="baseline" checked>额外运行默认分支对照测试</label></details></section>
<div class="actions"><button id="resolve">解析版本</button><button id="submit" class="primary" disabled>提交联合验证</button></div><p id="message" role="status"></p><div id="versions"></div><label id="risk" hidden><input id="approve" type="checkbox">确认运行本次列出的构建敏感变更</label></main>
<script>
const $=id=>document.getElementById(id), base='__EDITOR_API_BASE__';let catalog, members=[], submission=null,revision=0;
const draftKey='pipeline-branch-draft-v1';
async function api(path,body){const r=await fetch(base+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-Selection-Token':'__TOKEN__'}:{},body:body?JSON.stringify(body):undefined});if(r.status===401){location.href='/?return_to='+encodeURIComponent('/submit/');throw Error('登录已失效')}const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function selections(){return [...$('rows').children].map(row=>({repo:row.querySelector('.repo').value,head_ref:row.querySelector('.head').value}))}
function save(){localStorage.setItem(draftKey,JSON.stringify({name:$('name').value,members:selections(),suites:[...document.querySelectorAll('[name=suite]:checked')].map(x=>x.value),baseline:$('baseline').checked}))}
function invalidate(){revision++;members=[];submission=null;$('submit').disabled=true;$('versions').replaceChildren();$('risk').hidden=true;$('approve').checked=false;save();scope()}
function scope(){const ids=[...document.querySelectorAll('[name=suite]:checked')].map(x=>x.value);$('scope').textContent=$('baseline').checked&&['E01','E02','E03'].every(x=>ids.includes(x))?'核心回归集合 · 仅适用于本次版本组合':'局部验证 · 不代表完整回归通过'}
async function row(initial={}){const el=document.createElement('div');el.className='row';for(const [className,label] of [['repo','仓库'],['head','测试分支']]){const l=document.createElement('label');l.textContent=label;const select=document.createElement('select');select.className=className;l.append(select);el.append(l)}const remove=document.createElement('button');remove.textContent='×';remove.title='移除仓库';remove.onclick=()=>{el.remove();invalidate()};el.append(remove);const repo=el.querySelector('.repo');repo.add(new Option('选择仓库',''));for(const name of catalog.supported)repo.add(new Option(name,'rollingfruit/'+name));$('rows').append(el);
async function load(){el.querySelector('.head').replaceChildren();invalidate();if(!repo.value)return;if(selections().filter(m=>m.repo===repo.value).length>1){$('message').textContent='同仓最多选择一个分支';return}repo.disabled=true;try{const d=await api('/api/branches?repo='+encodeURIComponent(repo.value));const s=el.querySelector('.head');for(const b of d.branches)s.add(new Option(b.name,b.name));s.value=d.branches.some(b=>b.name===initial.head_ref)?initial.head_ref:d.default_branch;initial={};}catch(e){$('message').textContent=e.message}finally{repo.disabled=false;save()}}
repo.onchange=load;el.querySelector('.head').onchange=invalidate;if(initial.repo){repo.value=initial.repo;await load()}}
$('add').onclick=()=>row();$('name').oninput=invalidate;$('baseline').onchange=invalidate;
$('resolve').onclick=async()=>{const requested=revision;$('message').textContent='正在核实分支版本…';$('resolve').disabled=true;try{const out=await api('/api/branches/resolve',{members:selections()});if(requested!==revision)throw Error('配置已变化，请重新解析版本');if(out.results.some(r=>!r.ok))throw Error(out.results.filter(r=>!r.ok).map(r=>r.error).join('\n'));members=out.results.map(r=>r.member);const table=document.createElement('table'),heading=document.createElement('tr');for(const name of ['仓库','测试版本','默认分支对照']){const th=document.createElement('th');th.textContent=name;heading.append(th)}table.append(heading);for(const m of members){const tr=document.createElement('tr');for(const [text,full] of [[m.repo,m.repo],[m.head_ref+' · '+m.head_sha.slice(0,12),m.head_sha],[m.base_ref+' · '+m.base_sha.slice(0,12),m.base_sha]]){const td=document.createElement('td');td.textContent=text;td.title=full;tr.append(td)}table.append(tr)}$('versions').replaceChildren(table);const risks=members.flatMap(m=>m.risky_files.map(f=>m.repo+': '+f));$('risk').hidden=!risks.length;$('message').textContent=risks.length?'构建敏感变更：\n'+risks.join('\n'):'版本已固定';$('submit').disabled=false;submission='branch-'+cryptoRandom();}catch(e){$('message').textContent=e.message;$('submit').disabled=true}finally{$('resolve').disabled=false}};
function cryptoRandom(){return Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('')}
$('submit').onclick=async()=>{$('submit').disabled=true;try{const suite_ids=[...document.querySelectorAll('[name=suite]:checked')].map(x=>x.value);const d=await api('/api/batches',{source_mode:'branch',name:$('name').value,members,suite_ids,submission_id:submission,codex_review:false,github_write:false,baseline_enabled:$('baseline').checked,approve_risky:$('approve').checked});location.href=d.web_url}catch(e){$('message').textContent=e.message;$('submit').disabled=false}};
(async()=>{let draft={};try{draft=JSON.parse(localStorage.getItem(draftKey)||'{}')}catch{}catalog=await api('/api/catalog');for(const s of catalog.suites){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.name='suite';input.value=s.id;input.disabled=!s.implemented;input.checked=s.implemented&&(draft.suites||['E01','E02','E03']).includes(s.id);input.onchange=invalidate;label.append(input,document.createTextNode(s.id+' '+s.name));$('suites').append(label)}$('name').value=draft.name||$('name').value;$('baseline').checked=draft.baseline!==false;for(const m of draft.members?.length?draft.members:[{}])await row(m);scope()})().catch(e=>$('message').textContent=e.message);
</script></html>
