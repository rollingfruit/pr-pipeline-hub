<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联合验证 · Pipeline Hub</title>
<style>*{box-sizing:border-box;letter-spacing:0}body{margin:0;font:14px/1.6 system-ui;color:#20313d;background:#fff}header{padding:20px 32px;border-bottom:1px solid #ddd}h1{font-size:23px;margin:12px 0}h2{font-size:17px}main{padding:24px 32px;max-width:1600px;margin:auto}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px}.settings{border-left:1px solid #ddd;padding-left:24px}textarea,input,select{font:inherit;padding:9px;border:1px solid #cad7df;border-radius:4px;max-width:100%}textarea{width:100%;height:85px}button{font:inherit;cursor:pointer;padding:9px 16px;border:1px solid #bdd3d8;border-radius:4px;background:#f5fafb;color:#057b87}button:disabled{opacity:.5;cursor:default}label{display:block;margin:12px 0}input[type=checkbox]{margin-right:10px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #e1e9ed;overflow-wrap:anywhere}th{background:#f3f7f9}small{display:block;color:#6d7c88}a{color:#007d90;overflow-wrap:anywhere}.tools{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.notice{color:#a65d00;background:#fff6e2;padding:12px}#result{white-space:pre-wrap;overflow-wrap:anywhere}footer{border-top:1px solid #ddd;padding:20px 0;display:flex;gap:15px;align-items:center;flex-wrap:wrap}.primary{background:#008896;color:white}#prs{max-height:400px;overflow:auto}#members td:first-child{width:35px}code{font-size:11px}section{margin-bottom:22px}@media(max-width:760px){main,header{padding:16px}.layout{display:block}.settings{border:0;padding:0}table{font-size:12px}#members th:nth-child(3),#members td:nth-child(3){display:none}}</style>
<style>
body{background:#f7f9fb;color:#243746;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;background:white;border-bottom:1px solid #dce5eb;padding:18px 32px}
header b{font-size:17px}main{background:white;min-height:calc(100vh - 65px);max-width:1480px;padding:26px 32px}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px;border-bottom:1px solid #e1e9ed;padding-bottom:20px}
.page-title h1{font-size:24px;line-height:1.4}.page-title label{display:flex;align-items:center;gap:12px;margin:0}
.page-title input{width:280px}.layout{grid-template-columns:minmax(0,1fr) 300px;gap:32px}
section h2,.settings h2{margin:0 0 16px}section{margin-bottom:30px}textarea{height:110px;resize:vertical}
#prs{border-top:1px solid #e1e9ed;border-bottom:1px solid #e1e9ed;margin-bottom:24px}
#prs label{display:flex;align-items:flex-start;gap:10px;margin:0;padding:12px 8px;border-bottom:1px solid #eef2f5}
input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:#007d88;margin:4px 0 0}
#prs label:hover{background:#f4f8fa}.settings label{display:flex;align-items:flex-start;gap:10px}
details summary{padding:12px 8px;cursor:pointer;color:#637887}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #009ca5;outline-offset:3px}
footer{background:#fff;border-top:1px solid #dce5eb;margin-top:20px}
@media(max-width:760px){header,main{padding:16px}.page-title{display:block}.page-title label{align-items:flex-start;flex-direction:column;gap:6px}.page-title input{width:100%}.layout{display:block}.settings{padding-top:20px;border-top:1px solid #e1e9ed}.tools>*{flex:1 1 140px;min-width:0}footer{position:static}header b{font-size:15px}.page-title h1{font-size:22px}}
</style>
<header><b>PR Pipeline Hub</b><a href="http://119.8.233.58:8080/batches">返回联合验证看板</a></header><main>
<div class="page-title"><h1>新建 PR 联合验证</h1><label>批次名称 <input id="name" value="跨仓关键链路回归" maxlength="120"></label></div>
<div class="layout"><div><section><h2>1 选择本次 PR</h2><textarea id="urls" aria-label="PR 链接" placeholder="每行一个 GitHub PR 链接"></textarea><div class="tools"><button id="resolve">解析链接</button><select id="repo" aria-label="仓库筛选"><option>全部仓库</option></select><input id="search" placeholder="搜索 PR 或标题"></div><div id="prs"></div>
<h2>已解析 PR</h2><table id="members"><thead><tr><th>纳入</th><th>仓库 / PR</th><th>固定版本</th><th>校验状态</th></tr></thead><tbody></tbody></table></section>
<section><h2>2 联合候选环境</h2><p id="selection">尚未选择 PR</p><p class="notice">同仓最多一个 PR。其他服务固定集成基线；版本变化需重新解析后提交。</p><small>public-service、observability 尚无候选映射，暂不支持纳入。</small></section></div>
<aside class="settings"><h2>3 执行配置</h2><h3>E2E 用例</h3><div id="suites"></div><hr><label><input type="checkbox" id="codex">Codex 代码检视</label><small>不影响 E2E 中真实 Agent 的执行</small><label><input type="checkbox" id="baseline" checked>基线对照</label><label><input type="checkbox" id="github" checked>GitHub 结果回写</label><label><input type="checkbox" id="risky">确认本次构建敏感变更</label><small>仅在已核对表中列出的构建变更后勾选</small><p class="notice">结果仅适用于本次版本组合与所选用例，不代表单个 PR 可独立合入。</p></aside></div>
<footer><button id="draft">保存草稿</button><button class="primary" id="submit">提交联合验证</button><span id="result" role="status"></span></footer></main>
<script>
const API_BASE='__EDITOR_API_BASE__';
function submissionId(){return 'batch-'+Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');}
const $=s=>document.querySelector(s);let parsed=[],catalog=[],monitors=[],submission=submissionId();
const text=(tag,value)=>{const e=document.createElement(tag);e.textContent=value;return e;};
function invalidate(){parsed=[];submission=submissionId();render();$('#result').textContent='PR 链接已变更，请重新解析';}
$('#urls').addEventListener('input',invalidate);
async function post(url,data){const r=await fetch(API_BASE+url,{method:'POST',headers:{'Content-Type':'application/json','X-Selection-Token':'__TOKEN__'},body:JSON.stringify(data)});const out=await r.json();if(!r.ok)throw Error(out.error||'请求失败');return out;}
function selected(){return parsed.filter(p=>p.selected&&p.ok).map(p=>p.member);}
function render(){const tbody=$('#members tbody');tbody.replaceChildren();for(const p of parsed){const row=document.createElement('tr'),cell=document.createElement('td'),c=document.createElement('input');c.type='checkbox';c.checked=!!p.selected;c.disabled=!p.ok;c.onchange=()=>{p.selected=c.checked;submission=submissionId();render();};cell.append(c);row.append(cell);row.append(text('td',p.ok?p.member.repo+' #'+p.member.pr_number+' '+p.member.title:p.url));row.append(text('td',p.ok?'head '+p.member.head_sha.slice(0,8)+' / base '+p.member.base_sha.slice(0,8):'—'));row.append(text('td',p.ok?(p.member.risky_files.length?'需确认：'+p.member.risky_files.join(', '):'可纳入'):p.error));tbody.append(row);}$('#selection').textContent='已选 '+selected().length+' 个 PR：'+selected().map(m=>m.repo.split('/')[1]).join('、');}
function inventory(){const root=$('#prs');root.replaceChildren();const filtered=monitors.flatMap(m=>(m.pull_requests||[]).filter(p=>p.state==='open'&&!p.draft).map(p=>({...p,repo:m.repo}))).filter(p=>($('#repo').value==='全部仓库'||p.repo===$('#repo').value)&&(p.repo+' '+p.number+' '+p.title).toLowerCase().includes($('#search').value.toLowerCase())).sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at));const older=document.createElement('details');older.append(text('summary','一天以前的未合入 PR'));for(const p of filtered){const label=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=$('#urls').value.split(/\s+/).includes(p.html_url);c.disabled=['public-service','observability'].includes(p.repo.split('/')[1]);c.onchange=()=>{let urls=$('#urls').value.split(/\s+/).filter(Boolean);urls=urls.filter(u=>u!==p.html_url);if(c.checked)urls.push(p.html_url);$('#urls').value=urls.join('\n');invalidate();};label.append(c,text('span',p.repo+' #'+p.number+' '+p.title));(Date.parse(p.updated_at)<Date.now()-86400000?older:root).append(label);}if(older.children.length>1)root.append(older);}
$('#repo').onchange=inventory;$('#search').oninput=inventory;
$('#resolve').onclick=async()=>{const b=$('#resolve');b.disabled=true;$('#result').textContent='正在解析 GitHub 版本...';try{const out=await post('/api/batches/resolve',{urls:$('#urls').value.split(/\s+/).filter(Boolean)});parsed=out.results.map(p=>({...p,selected:p.ok}));submission=submissionId();render();$('#result').textContent='解析完成，请核对选中项';}catch(e){$('#result').textContent=e.message;}finally{b.disabled=false;}};
$('#submit').onclick=async()=>{const b=$('#submit');b.disabled=true;$('#result').textContent='正在核实版本和环境...';try{if(parsed.some(p=>p.selected&&!p.ok))throw Error('已选 PR 存在校验失败');const payload={name:$('#name').value,members:selected(),suite_ids:[...document.querySelectorAll('#suites input:checked')].map(e=>e.value),codex_review:$('#codex').checked,baseline_enabled:$('#baseline').checked,github_write:$('#github').checked,approve_risky:$('#risky').checked,submission_id:submission};const out=await post('/api/batches',payload);$('#result').textContent='已入队：';const a=text('a',out.id);a.href=out.web_url;a.target='_blank';a.rel='noreferrer';$('#result').append(a);}catch(e){$('#result').textContent=e.message;}finally{b.disabled=false;}};
for(const id of ['name','codex','baseline','github','risky'])$('#'+id).addEventListener('change',()=>submission=submissionId());
$('#draft').onclick=()=>{localStorage.setItem('batch-draft',JSON.stringify({name:$('#name').value,urls:$('#urls').value,suites:[...document.querySelectorAll('#suites input:checked')].map(e=>e.value),codex:$('#codex').checked,baseline:$('#baseline').checked,github:$('#github').checked}));$('#result').textContent='草稿已保存在本机浏览器';};
(async()=>{try{const r=await fetch(API_BASE+'/api/catalog');if(!r.ok)throw Error('用例目录暂不可用');const data=await r.json();monitors=data.monitors;for(const m of monitors){const o=text('option',m.repo);$('#repo').append(o);}for(const s of data.suites){const label=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.value=s.id;c.disabled=!s.implemented;c.checked=['E01','E02','E03'].includes(s.id);c.onchange=()=>submission=submissionId();label.append(c,text('span',s.id+' '+s.name+(s.implemented?'':' · 未实现')));$('#suites').append(label);}const draft=JSON.parse(localStorage.getItem('batch-draft')||'null');if(draft){$('#name').value=draft.name;$('#urls').value=draft.urls;for(const id of ['codex','baseline','github'])if(typeof draft[id]==='boolean')$('#'+id).checked=draft[id];if(Array.isArray(draft.suites))for(const c of document.querySelectorAll('#suites input'))c.checked=!c.disabled&&draft.suites.includes(c.value);}for(const [id,key] of [['codex','code_review'],['github','github_write']])if(data.features&&data.features[key]===false){$('#'+id).checked=false;$('#'+id).disabled=true;}inventory();}catch(e){$('#result').textContent=e.message;}})();
</script></html>
