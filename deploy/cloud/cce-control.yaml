# Render image, storage class and ingress for the target CCE cluster before apply.
# Configuration and secrets are created separately; never commit real secrets.
apiVersion: v1
kind: Namespace
metadata:
  name: pr-pipeline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-archives
  namespace: pr-pipeline
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: REPLACE_CCE_STORAGE_CLASS
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-control
  namespace: pr-pipeline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: pipeline-control}
  template:
    metadata:
      labels: {app: pipeline-control}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: default-secret}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 2000
        fsGroup: 2000
      containers:
        - name: control
          image: REPLACE_SWR_IMAGE_WITH_DIGEST
          ports: [{name: http, containerPort: 8792}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: config, mountPath: /etc/pr-pipeline/config.toml, subPath: config.toml, readOnly: true}
            - {name: secrets, mountPath: /etc/pr-pipeline/secrets, readOnly: true}
            - {name: archives, mountPath: /var/lib/pr-pipeline/archives}
      volumes:
        - name: config
          configMap: {name: pipeline-config}
        - name: secrets
          secret: {secretName: pipeline-secrets, defaultMode: 288}
        - name: archives
          persistentVolumeClaim: {claimName: pipeline-archives}
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-control
  namespace: pr-pipeline
spec:
  type: ClusterIP
  selector: {app: pipeline-control}
  ports: [{name: http, port: 8792, targetPort: http}]
