# Install behind a TLS ELB, or add your certificate configuration here.
# Never expose the editor directly over plaintext Internet HTTP.
server {
    listen 8080;
    server_name _;
    client_max_body_size 64k;
    add_header Referrer-Policy no-referrer always;
    location /internal/ { return 404; }
    location = /submit { return 302 /submit/; }
    location /submit/ {
        proxy_pass http://127.0.0.1:8793/;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        # Do not log signed request headers or submission bodies.
    }
    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }
}
