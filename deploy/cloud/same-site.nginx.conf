server {
    listen 80;
    listen 8080;
    server_name 119.8.233.58;
    access_log off;
    client_max_body_size 2m;
    add_header Referrer-Policy no-referrer always;
    # auth_request converts unavailable upstreams into a local 500.
    error_page 500 = @pipeline_auth_unavailable;
    location @pipeline_auth_unavailable {
        default_type application/json;
        return 503 '{"error":"Authentication service unavailable; please retry later"}';
    }
    location = /_pipeline_auth {
        internal;
        proxy_pass http://127.0.0.1:8793/internal/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location @pipeline_login { return 302 /?return_to=$uri; }
    location = /api/auth/pipeline { return 404; }
    location ~ ^/(internal|webhooks)(/|$) { return 404; }
    location ~ ^/pipeline/(internal|webhooks)(/|$) { return 404; }
    location ~ ^/submit/(internal|webhooks)(/|$) { return 404; }
    location ~ ^/(runs|batches|artifacts)/ { return 302 /pipeline$uri; }
    location = /pipeline { return 302 /pipeline/; }
    location = /submit { return 302 /submit/; }
    location /pipeline/api/ {
        auth_request /_pipeline_auth;
        proxy_pass http://127.0.0.1:8792/api/;
        proxy_set_header X-Worker-Token "";
        proxy_set_header X-Pipeline-User "";
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        error_page 401 = @pipeline_api_login;
    }
    location @pipeline_api_login {
        default_type application/json;
        return 401 '{"error":"Robot CI login required"}';
    }
    location /pipeline/ {
        auth_request /_pipeline_auth;
        error_page 401 = @pipeline_login;
        proxy_pass http://127.0.0.1:8792/;
        proxy_set_header X-Worker-Token "";
        proxy_set_header X-Pipeline-User "";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /submit/api/ {
        auth_request /_pipeline_auth;
        error_page 401 = @pipeline_api_login;
        proxy_pass http://127.0.0.1:8793/api/;
        proxy_set_header X-Worker-Token "";
        proxy_set_header X-Pipeline-User "";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /submit/ {
        auth_request /_pipeline_auth;
        error_page 401 = @pipeline_login;
        proxy_pass http://127.0.0.1:8793/;
        proxy_set_header X-Worker-Token "";
        proxy_set_header X-Pipeline-User "";
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
